name: funnier-ingest
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-verify clips and pull new candidates from allowlisted channel feeds
        working-directory: funnier
        run: |
          node tally/ingest.mjs
          cp clips.json site/clips.json
      - name: Commit
        run: |
          git config user.name "funnier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add funnier/clips.json funnier/site/clips.json funnier/candidates.json
          git diff --cached --quiet || (git commit -q -m "funnier: daily catalog check" && git push -q)
